name: Daily Global Knowledge Report

on:
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report generation mode"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - api
      report_date:
        description: "Missing date to recover (YYYY-MM-DD); leave blank for today"
        required: false
        type: string

  schedule:
    # GitHub cron은 UTC 기준입니다. 매일 20:00 UTC = 다음 날 05:00 KST.
    # 다음 몇 회 실행에서 예약 시각과 실제 시작·공개 시각의 차이를 측정합니다.
    - cron: "0 20 * * *"
    # 23:15 UTC = 08:15 KST. 첫 실행이 실패했을 때 자동 복구하며,
    # 이미 발행되었다면 REPORT_SKIP_EXISTING_DATE가 중복 생성을 막습니다.
    - cron: "15 23 * * *"

concurrency:
  group: daily-global-knowledge-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    # API 생성은 요청당 최대 10분이며 검증 재시도가 두 번 있을 수 있습니다.
    # 생성·검증(최대 약 30분) 뒤 Pages 공개 확인을 최대 15분 수행합니다.
    timeout-minutes: 55

    env:
      REPORT_TIMEZONE: Asia/Seoul
      REPORT_LANGUAGE: ko
      REPORT_MIN_PAGES: "6"
      REPORT_TARGET_PAGES: "7-9"
      # 예약 실행은 항상 API로 발행하고, 수동 실행만 선택한 모드를 사용합니다.
      REPORT_MODE: ${{ github.event_name == 'schedule' && 'api' || github.event.inputs.report_mode || 'mock' }}
      # 같은 날짜에 이미 정식 발행된 리포트가 있으면 예약 재실행은 건너뜁니다.
      REPORT_SKIP_EXISTING_DATE: ${{ github.event_name == 'schedule' && '1' || '0' }}
      REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
      REPORT_SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      SITE_BASE_URL: https://jona0214-rgb.github.io/global-knowledge-journal/
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_TIMEOUT_SECONDS: "600"
      # SDK 내부 장시간 재시도 대신 연결 끊김·429·5xx만 짧게 재시도합니다.
      OPENAI_MAX_RETRIES: "0"
      OPENAI_CONNECTION_RETRIES: "2"
      OPENAI_RETRY_BASE_SECONDS: "10"
      # 고정 wire schema 밖의 내용·분량 검증 실패는 오류 피드백과 함께 최대 2회 재생성합니다.
      REPORT_VALIDATION_RETRIES: "2"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Record workflow start
        shell: bash
        run: |
          RUN_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -n "$REPORT_DATE" ]; then
            EFFECTIVE_DATE="$REPORT_DATE"
          else
            EFFECTIVE_DATE="$(TZ=Asia/Seoul date +'%Y-%m-%d')"
          fi

          echo "REPORT_RUN_STARTED_AT=$RUN_STARTED_AT" >> "$GITHUB_ENV"
          echo "REPORT_EFFECTIVE_DATE=$EFFECTIVE_DATE" >> "$GITHUB_ENV"
          echo "workflow_started_at_utc=$RUN_STARTED_AT"
          echo "effective_report_date=$EFFECTIVE_DATE"
          echo "schedule_cron=${REPORT_SCHEDULE_CRON:-manual}"
          {
            echo "## Schedule timing"
            echo ""
            echo "- Effective report date: \`$EFFECTIVE_DATE\`"
            echo "- Cron slot: \`${REPORT_SCHEDULE_CRON:-manual}\`"
            echo "- Runner started at UTC: \`$RUN_STARTED_AT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean fonts
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          FONT_LIST="$RUNNER_TEMP/font-families.txt"

          if command -v fc-list >/dev/null 2>&1; then
            fc-list : family > "$FONT_LIST"
          else
            : > "$FONT_LIST"
          fi

          if ! grep -qi "Noto Sans CJK" "$FONT_LIST"; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              fontconfig \
              fonts-noto-cjk
            fc-cache -f
            fc-list : family > "$FONT_LIST"
          fi

          if ! grep -qi "Noto Sans CJK" "$FONT_LIST"; then
            echo "Noto Sans CJK font installation failed." >&2
            exit 1
          fi

          grep -i "Noto Sans CJK" "$FONT_LIST" | sort -u | sed -n '1,5p'

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Generate daily report
        run: |
          echo "REPORT_MODE=$REPORT_MODE"
          echo "REPORT_DATE=${REPORT_DATE:-today(KST)}"

          if [ "$REPORT_MODE" = "api" ]; then
            if [ -n "$REPORT_DATE" ]; then
              python scripts/run_daily_report.py --api --date "$REPORT_DATE"
            else
              python scripts/run_daily_report.py --api
            fi
          else
            if [ -n "$REPORT_DATE" ]; then
              python scripts/run_daily_report.py --mock --date "$REPORT_DATE"
            else
              python scripts/run_daily_report.py --mock
            fi
          fi

      - name: Commit generated report
        if: env.REPORT_MODE == 'api'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data public

          echo "Generated output files:"
          find outputs -maxdepth 1 -type f \( -name "*.json" -o -name "*.html" -o -name "*.pdf" \) -print

          find outputs -maxdepth 1 -type f \( -name "*.json" -o -name "*.html" -o -name "*.pdf" \) -exec git add -f {} +

          echo "Staged files:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: generate daily report"
            git push
          fi

      - name: Verify report is visible on GitHub Pages
        if: env.REPORT_MODE == 'api'
        continue-on-error: true
        timeout-minutes: 16
        run: |
          python scripts/verify_published_site.py \
            --base-url "$SITE_BASE_URL" \
            --date "$REPORT_EFFECTIVE_DATE" \
            --timeout-seconds 900 \
            --interval-seconds 15

      - name: Upload mock layout preview
        if: env.REPORT_MODE == 'mock'
        uses: actions/upload-artifact@v4
        with:
          name: mock-report-preview-${{ github.run_id }}
          path: outputs/
          retention-days: 3

      - name: Show recovery procedure
        if: failure()
        run: |
          {
            echo "## Daily report recovery"
            echo ""
            echo "1. Open the failed step and identify API connection, structure validation, PDF page count, or setup failure."
            echo "2. A scheduled failure is retried automatically at 08:15 KST."
            echo "3. To retry today manually:"
            echo '   `gh workflow run daily-report.yml --ref main -f report_mode=api`'
            echo "4. To recover a missing date:"
            echo '   `gh workflow run daily-report.yml --ref main -f report_mode=api -f report_date=YYYY-MM-DD`'
            echo ""
            echo "Incomplete reports remain unpublished because validation and PDF checks run before catalog updates."
          } >> "$GITHUB_STEP_SUMMARY"


