name: Daily Global Knowledge Report

on:
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report generation mode"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - api
      report_date:
        description: "Missing date to recover (YYYY-MM-DD); leave blank for today"
        required: false
        type: string

  schedule:
    # GitHub cron은 UTC 기준입니다.
    # 14:45 UTC = 23:45 KST: 작업을 미리 시작하고 00:00 생성 게이트까지 대기.
    - cron: "45 14 * * *"
    # 18:15 UTC = 다음 날 03:15 KST: 누락 시 2차 생성 및 복구.
    - cron: "15 18 * * *"
jobs:
  prepare-report:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: daily-global-knowledge-report-generation
      cancel-in-progress: false

    env:
      REPORT_TIMEZONE: Asia/Seoul
      REPORT_LANGUAGE: ko
      REPORT_MIN_PAGES: "6"
      REPORT_TARGET_PAGES: "7-9"
      REPORT_MODE: ${{ github.event_name == 'schedule' && 'api' || github.event.inputs.report_mode || 'mock' }}
      REPORT_SKIP_EXISTING_DATE: ${{ github.event_name == 'schedule' && '1' || '0' }}
      REPORT_RECOVER_MISSING_DAYS: ${{ github.event_name == 'schedule' && '3' || '1' }}
      REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
      REPORT_SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      SITE_BASE_URL: https://jona0214-rgb.github.io/global-knowledge-journal/
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_TIMEOUT_SECONDS: "600"
      OPENAI_MAX_OUTPUT_TOKENS: "24000"
      OPENAI_MAX_RETRIES: "0"
      OPENAI_CONNECTION_RETRIES: "2"
      OPENAI_RETRY_BASE_SECONDS: "10"
      REPORT_VALIDATION_RETRIES: "2"

    steps:
      - name: Wait for the 00:00 KST generation gate
        if: github.event_name == 'schedule' && github.event.schedule == '45 14 * * *'
        shell: bash
        run: |
          KST_HOUR="$(TZ=Asia/Seoul date +'%H')"
          if [ "$KST_HOUR" -ge 12 ]; then
            TARGET_TEXT="$(TZ=Asia/Seoul date -d 'tomorrow' +'%Y-%m-%d') 00:00:00 +0900"
          else
            TARGET_TEXT="$(TZ=Asia/Seoul date +'%Y-%m-%d') 00:00:00 +0900"
          fi
          TARGET_EPOCH="$(date -d "$TARGET_TEXT" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          WAIT_SECONDS=$((TARGET_EPOCH - NOW_EPOCH))

          if [ "$WAIT_SECONDS" -gt 0 ] && [ "$WAIT_SECONDS" -le 3600 ]; then
            echo "00:00 KST 생성 게이트까지 ${WAIT_SECONDS}초 대기합니다."
            sleep "$WAIT_SECONDS"
          elif [ "$WAIT_SECONDS" -gt 3600 ]; then
            echo "예약 실행이 크게 지연되어 다음 날이 아닌 현재 날짜 리포트를 즉시 생성합니다."
          fi

      - name: Record workflow start
        shell: bash
        run: |
          RUN_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -n "$REPORT_DATE" ]; then
            EFFECTIVE_DATE="$REPORT_DATE"
          else
            EFFECTIVE_DATE="$(TZ=Asia/Seoul date +'%Y-%m-%d')"
          fi

          echo "REPORT_RUN_STARTED_AT=$RUN_STARTED_AT" >> "$GITHUB_ENV"
          echo "REPORT_EFFECTIVE_DATE=$EFFECTIVE_DATE" >> "$GITHUB_ENV"
          {
            echo "## Generation timing"
            echo ""
            echo "- Effective report date: \`$EFFECTIVE_DATE\`"
            echo "- Cron slot: \`${REPORT_SCHEDULE_CRON:-manual}\`"
            echo "- Runner started at UTC: \`$RUN_STARTED_AT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare scheduled staging branch
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin report-staging >/dev/null 2>&1; then
            git fetch origin report-staging
            git switch --force-create report-staging origin/report-staging
            if ! git rebase origin/main; then
              git rebase --abort
              echo "report-staging을 최신 main 위로 재배치하지 못했습니다." >&2
              exit 1
            fi
          else
            git switch --create report-staging origin/main
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean fonts
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          FONT_LIST="$RUNNER_TEMP/font-families.txt"

          if command -v fc-list >/dev/null 2>&1; then
            fc-list : family > "$FONT_LIST"
          else
            : > "$FONT_LIST"
          fi

          if ! grep -qi "Noto Sans CJK" "$FONT_LIST"; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              fontconfig \
              fonts-noto-cjk
            fc-cache -f
            fc-list : family > "$FONT_LIST"
          fi

          if ! grep -qi "Noto Sans CJK" "$FONT_LIST"; then
            echo "Noto Sans CJK font installation failed." >&2
            exit 1
          fi

          grep -i "Noto Sans CJK" "$FONT_LIST" | sort -u | sed -n '1,5p'

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Generate API report
        if: env.REPORT_MODE == 'api'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "REPORT_MODE=$REPORT_MODE"
          echo "REPORT_DATE=${REPORT_DATE:-today(KST)}"
          if [ -n "$REPORT_DATE" ]; then
            python scripts/run_daily_report.py --api --date "$REPORT_DATE"
          else
            python scripts/run_daily_report.py --api
          fi

      - name: Generate mock report
        if: env.REPORT_MODE == 'mock'
        run: |
          echo "REPORT_MODE=$REPORT_MODE"
          echo "REPORT_DATE=${REPORT_DATE:-today(KST)}"
          if [ -n "$REPORT_DATE" ]; then
            python scripts/run_daily_report.py --mock --date "$REPORT_DATE"
          else
            python scripts/run_daily_report.py --mock
          fi

      - name: Build and validate public knowledge data
        if: env.REPORT_MODE == 'api'
        run: python scripts/build_knowledge_graph.py

      - name: Commit generated report
        if: env.REPORT_MODE == 'api'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data public
          find outputs -maxdepth 1 -type f \( -name "*.json" -o -name "*.html" -o -name "*.pdf" \) -exec git add -f {} +

          echo "Staged files:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: stage daily report"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              git push origin HEAD:report-staging
              echo "검증된 리포트를 report-staging에 저장했습니다. 07:00 공개 전까지 main에는 반영하지 않습니다."
            else
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Verify manually generated report on GitHub Pages
        if: github.event_name == 'workflow_dispatch' && env.REPORT_MODE == 'api'
        continue-on-error: true
        timeout-minutes: 16
        run: |
          python scripts/verify_published_site.py \
            --base-url "$SITE_BASE_URL" \
            --date "$REPORT_EFFECTIVE_DATE" \
            --timeout-seconds 900 \
            --interval-seconds 15

      - name: Upload mock layout preview
        if: env.REPORT_MODE == 'mock'
        uses: actions/upload-artifact@v4
        with:
          name: mock-report-preview-${{ github.run_id }}
          path: outputs/
          retention-days: 3

      - name: Upload API failure diagnostics
        if: failure() && env.REPORT_MODE == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: api-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/api_response_debug_*.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Show recovery procedure
        if: failure()
        run: |
          {
            echo "## Daily report recovery"
            echo ""
            echo "1. Open the failed step and identify API connection, incomplete response, structure validation, PDF page count, or setup failure."
            echo "2. For an incomplete or malformed API response, download the api-failure-diagnostics artifact."
            echo "3. A scheduled failure is retried automatically at 03:15 KST."
            echo "4. To retry today manually:"
            echo '   `gh workflow run daily-report.yml --ref main -f report_mode=api`'
            echo "5. To recover a missing date:"
            echo '   `gh workflow run daily-report.yml --ref main -f report_mode=api -f report_date=YYYY-MM-DD`'
            echo ""
            echo "Scheduled output remains on report-staging until the 07:00 publication gate."
          } >> "$GITHUB_STEP_SUMMARY"
