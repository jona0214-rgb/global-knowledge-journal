name: Daily Global Knowledge Journal

on:
  workflow_dispatch:

#  schedule:
#    # 매일 한국시간 00:10 실행
#    # GitHub Actions cron은 UTC 기준이므로, 00:10 KST = 전날 15:10 UTC
#    - cron: "10 15 * * *"


permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Generate mock report
        run: |
          python scripts/run_daily_report.py --mock

      - name: Commit generated report files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data public
          git add -f outputs/*.json outputs/*.html outputs/*.pdf

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: generate daily report"
            git push
          fi