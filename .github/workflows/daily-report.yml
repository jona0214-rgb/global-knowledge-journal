name: Daily Global Knowledge Report

on:
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report generation mode"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - api

  # schedule:
  #   - cron: "0 21 * * *"
  #
  # 예약 실행은 현재 비활성화 상태입니다.
  # 실제 API 결제/쿼터 확인 후 다시 활성화합니다.

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    env:
      REPORT_TIMEZONE: Asia/Seoul
      REPORT_LANGUAGE: ko
      REPORT_MIN_PAGES: "7"
      REPORT_TARGET_PAGES: "7-9"
      REPORT_MODE: ${{ github.event.inputs.report_mode || 'mock' }}
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fontconfig
          fc-cache -fv

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Generate daily report
        run: |
          echo "REPORT_MODE=$REPORT_MODE"

          if [ "$REPORT_MODE" = "api" ]; then
            python scripts/run_daily_report.py --api
          else
            python scripts/run_daily_report.py --mock
          fi

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data public

          echo "Generated output files:"
          find outputs -maxdepth 1 -type f \( -name "*.json" -o -name "*.html" -o -name "*.pdf" \) -print

          find outputs -maxdepth 1 -type f \( -name "*.json" -o -name "*.html" -o -name "*.pdf" \) -exec git add -f {} +

          echo "Staged files:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: generate daily report"
            git push
          fi