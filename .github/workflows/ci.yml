name: Validate Project

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: >-
          python -m py_compile
          scripts/run_daily_report.py
          scripts/generate_report.py
          scripts/record_publication.py
          scripts/verify_published_site.py
          scripts/build_knowledge_graph.py
          scripts/audit_project.py
          scripts/report_pipeline/concept_extractor.py
          scripts/report_pipeline/knowledge_graph.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Audit project data
        run: python scripts/audit_project.py
      - name: Validate knowledge graph build
        run: python scripts/build_knowledge_graph.py --check

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node tests/test_homepage_filters.mjs
      - run: node tests/test_logs_page.mjs
