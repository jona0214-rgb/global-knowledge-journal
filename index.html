<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Knowledge Journal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">GLOBAL KNOWLEDGE JOURNAL</p>
        <h1>Daily Knowledge Reports</h1>
        <p class="subtitle">
          과학, 공학, 인문학, 역사, 경제, 문화, 생태를 순환하며 매일 하나의 지식 리포트를 축적합니다.
        </p>
      </header>

      <section class="summary-grid">
        <article class="summary-card">
          <span class="summary-label">Status</span>
          <strong id="site-status">Loading</strong>
        </article>

        <article class="summary-card">
          <span class="summary-label">Reports</span>
          <strong id="report-count">-</strong>
        </article>

        <article class="summary-card">
          <span class="summary-label">Latest Date</span>
          <strong id="latest-date">-</strong>
        </article>
      </section>

      <section class="section">
        <div class="section-heading">
          <p class="section-kicker">LATEST</p>
          <h2>Latest Report</h2>
        </div>

        <div id="latest-report" class="latest-card loading-card">
          최신 리포트를 불러오는 중입니다.
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <p class="section-kicker">ARCHIVE</p>
          <h2>Report Archive</h2>
        </div>

        <div id="report-list" class="report-list loading-card">
          리포트 목록을 불러오는 중입니다.
        </div>
      </section>

      <footer class="footer">
        <p>Generated by Global Knowledge Journal automation pipeline.</p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
